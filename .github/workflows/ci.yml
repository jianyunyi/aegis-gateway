# CI/CD 流水线（GitHub Actions）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: backend/go.sum
      - name: 依赖
        run: go mod download
      - name: 静态检查
        run: go vet ./...
      - name: 单元测试（含竞态）
        run: go test ./... -race -count=1
      - name: 编译
        run: go build ./...

  enterprise-integration:
    name: Two gateway instances + dependency faults
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration
          MYSQL_DATABASE: aegis_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_MYSQL_DSN: "root:integration@tcp(127.0.0.1:3306)/aegis_test?charset=utf8mb4&parseTime=True&loc=UTC"
      TEST_REDIS_ADDR: "127.0.0.1:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: backend/go.sum
      - name: Two-instance fault and reconciliation acceptance
        run: go test -tags=integration ./integration ./internal/middleware -race -count=1 -timeout=120s -v

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 构建
        run: npm run build
