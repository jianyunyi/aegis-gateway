# CI/CD 流水线（GitHub Actions）
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: backend/go.sum
      - name: 依赖
        run: go mod download
      - name: 静态检查
        run: go vet ./...
      - name: 单元测试（含竞态）
        run: go test ./... -race -count=1
      - name: 编译
        run: go build ./...

  enterprise-integration:
    name: Two gateway instances + dependency faults
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: integration
          MYSQL_DATABASE: aegis_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -pintegration"
          --health-interval=5s --health-timeout=3s --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=20
    defaults:
      run:
        working-directory: backend
    env:
      TEST_MYSQL_DSN: "root:integration@tcp(127.0.0.1:3306)/aegis_test?charset=utf8mb4&parseTime=True&loc=UTC"
      TEST_REDIS_ADDR: "127.0.0.1:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"
          cache-dependency-path: backend/go.sum
      - name: Usage lock and compact SSE DONE regressions
        run: go test -tags=integration ./integration -race -count=1 -timeout=60s -run 'TestTwoInstancesFailOpenUsageProjection|TestQuotaProjectionDoesNotRegress|TestReconcileRedisStallDoesNotBlockUsage|TestReconcileRetriesConcurrentUsage|TestTwoInstancesStreamResults' -v
      - name: Two-instance fault and reconciliation acceptance
        run: go test -tags=integration ./integration ./internal/middleware ./internal/repository -race -count=1 -timeout=120s -v
      - name: MySQL migration integration tests
        run: go test -tags=integration ./migrations -race -count=1 -timeout=120s -v

  compose-build:
    name: Clean checkout Compose configuration and image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Generate disposable Compose secrets
        run: |
          ./scripts/init-compose-env.sh >/dev/null
          test "$(stat -c %a .secrets)" = 700
          for secret in mysql_root_password mysql_password mysql_dsn mysql_dsn_host redis_password jwt_secret bootstrap_admin_password; do
            test "$(stat -c %a ".secrets/$secret")" = 600
          done
          test "$(stat -c %a .secrets/redis.conf)" = 644
          ! grep -Eq '(^|_)(PASSWORD|SECRET|DSN)=' .env
      - name: Validate Compose configuration
        run: docker compose --env-file .env -f deploy/docker-compose.yml config --quiet
      - name: Validate VPN-only admin overlay and acceptance scripts
        run: |
          TS_AUTHKEY=ci-placeholder docker compose --env-file .env \
            -f deploy/docker-compose.yml \
            -f deploy/docker-compose.admin-vpn.yml config --quiet
          python3 - <<'PY'
          import json
          from pathlib import Path
          serve = json.loads(Path('deploy/admin-vpn/serve.json').read_text(encoding='utf-8'))
          assert serve['AllowFunnel']['${TS_CERT_DOMAIN}:443'] is False
          assert serve['Web']['${TS_CERT_DOMAIN}:443']['Handlers']['/']['Proxy'] == 'http://127.0.0.1:3000'
          PY
          bash -n scripts/verify-admin-access.sh scripts/verify-gateway-rollback.sh scripts/db-rehearsal.sh scripts/eval-samples.sh
      - name: Assert production privacy configuration
        run: |
          docker compose --env-file .env -f deploy/docker-compose.yml config --format json > /tmp/aegis-compose.json
          python3 - <<'PY'
          import json
          with open('/tmp/aegis-compose.json', encoding='utf-8') as f:
              config = json.load(f)
          value = config['services']['gateway']['environment']['PROMPT_CAPTURE_ENABLED']
          assert str(value).lower() == 'false', f'production prompt capture must be false, got {value!r}'
          PY
      - name: Build every Compose image
        run: docker compose --env-file .env -f deploy/docker-compose.yml build --pull
      - name: Start clean-checkout stack and verify readiness
        run: |
          if ! docker compose --env-file .env -f deploy/docker-compose.yml up -d; then
            docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color || true
            exit 1
          fi
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8081/readyz; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env -f deploy/docker-compose.yml logs --no-color
          exit 1
      - name: Verify admin web runs as non-root
        run: |
          uid=$(docker compose --env-file .env -f deploy/docker-compose.yml exec -T web id -u)
          test "$uid" -ne 0
      - name: Clean up Compose stack
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose --env-file .env -f deploy/docker-compose.yml down --volumes --remove-orphans
          fi

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 构建
        run: npm run build
