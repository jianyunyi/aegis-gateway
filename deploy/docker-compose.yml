services:
  mysql:
    image: mysql:8.0
    container_name: aegis-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: aegis
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aegis-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gateway
    container_name: aegis-gateway
    environment:
      APP_ENV: dev
      HTTP_ADDR: ":8080"
      MYSQL_DSN: "root:root@tcp(mysql:3306)/aegis?charset=utf8mb4&parseTime=True&loc=Local"
      REDIS_ADDR: "redis:6379"
      JWT_SECRET: "dev-secret-change-me"
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    container_name: aegis-web
    environment:
      NEXT_PUBLIC_API_BASE: /api/v1/admin
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  mysql-data:
  redis-data:
